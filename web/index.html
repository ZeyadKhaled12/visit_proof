<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wizpo is a marketplace of ready-to-use business apps for small teams. Choose the tools you need, try live demos, and start working in minutes—all in one workspace.">
  <meta name="theme-color" content="#15182D">

  <!-- Link previews (WhatsApp, X, LinkedIn…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wizpo">
  <meta property="og:title" content="Wizpo - Business Apps Made Simple | Small Apps, Big Magic">
  <meta property="og:description" content="Wizpo is a marketplace of ready-to-use business apps for small teams. Choose the tools you need, try live demos, and start working in minutes—all in one workspace.">
  <meta property="og:image" content="brand/wizpo-social.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wizpo">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wizpo - Business Apps Made Simple | Small Apps, Big Magic</title>

  <!-- Installing a designed app as a PWA (lib/core/pwa/). A link opened with
       "?app=…" is that app: it gets its own manifest from Flutter, so the
       Wizpo manifest is left out to keep the browser from offering Wizpo. -->
  <script>
    if (!/[?&]app=/.test(location.search)) {
      document.write('<link rel="manifest" href="manifest.json">');
    }
    window.wizpoPwa = (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () { deferred = null; });

      function tag(selector, create) {
        var el = document.head.querySelector(selector);
        if (!el) { el = create(); document.head.appendChild(el); }
        return el;
      }
      function link(rel) {
        return tag('link[rel="' + rel + '"]', function () {
          var l = document.createElement('link'); l.rel = rel; return l;
        });
      }
      function meta(name) {
        return tag('meta[name="' + name + '"]', function () {
          var m = document.createElement('meta'); m.name = name; return m;
        });
      }

      return {
        // A new manifest makes the browser check again and send a new
        // install prompt, so the old one is dropped.
        setManifest: function (json, icon, themeColor, title) {
          var blob = new Blob([json], { type: 'application/manifest+json' });
          link('manifest').href = URL.createObjectURL(blob);
          link('apple-touch-icon').href = icon;
          meta('theme-color').content = themeColor;
          meta('apple-mobile-web-app-title').content = title;
          deferred = null;
        },
        resetManifest: function () {
          link('manifest').href = 'manifest.json';
          link('apple-touch-icon').href = 'icons/apple-touch-icon.png';
          meta('theme-color').content = '#15182D';
          meta('apple-mobile-web-app-title').content = 'Wizpo';
          deferred = null;
        },
        canPrompt: function () { return deferred !== null; },
        prompt: async function () {
          if (!deferred) return 'unavailable';
          var e = deferred;
          deferred = null;
          await e.prompt();
          return (await e.userChoice).outcome;
        },
        isIos: function () {
          return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches ||
            navigator.standalone === true;
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
